# Docker Compose — High-Performance Production Setup
# Features: Nginx Load Balancer + 4 Cluster Replicas (4 vCPU utilization)
# Database is external (Supabase PostgreSQL).

services:
  # ─── 1. Node.js API Backend Workers (4 Cluster Replicas) ─────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: backend-api:latest
    restart: unless-stopped

    # Expose port internally to Docker network only (Nginx proxies public traffic)
    expose:
      - "5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "5000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5


    # Deploy 4 instances across 4 vCPU cores for maximum throughput
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

  # ─── 2. Nginx Load Balancer & Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: backend-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # Optional for SSL/TLS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
