worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for Ultra-Fast JSON payloads
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Upstream Pool — Docker DNS resolves 'api' to all container instances
    upstream backend_cluster {
        server api:5000 max_fails=3 fail_timeout=10s;
        keepalive 64; # High-performance persistent connection pool to Node workers
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Client body size limit (matches Multer 5MB limit + margin)
        client_max_body_size 10M;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # HTTP Keep-Alive headers
            proxy_set_header Connection "";

            # Forward real client IP and protocol to Express
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts to prevent hanging connections
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint for Nginx
        location /healthz {
            access_log off;
            return 200 "OK\n";
        }
    }
}
